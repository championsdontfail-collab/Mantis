<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Irregular Verbs Championship</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#482a12;font:18px Georgia,serif;background:radial-gradient(ellipse at 50% 8%,#fff5a8 0%,#b6d88c 23%,#50864c 56%,#183f32 100%);background-attachment:fixed}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.4;background:repeating-linear-gradient(110deg,transparent 0 95px,#153e2d 98px 112px,transparent 116px 200px)}main{position:relative;max-width:520px;margin:auto;padding:22px 15px 50px;text-align:center}h1{font-size:clamp(27px,8vw,40px);line-height:1.12;color:#fff4c7;text-shadow:2px 3px #523012,0 0 15px #174126;margin:10px 0}h2{margin:10px 0 18px}.dedication{font-size:17px;font-weight:bold;background:#fff1c8;border:3px solid #b47a39;border-radius:50%;padding:10px;margin:16px auto;max-width:310px;box-shadow:0 5px 12px #24451a77}.forest{font-size:31px;letter-spacing:8px}.mascot{font-size:90px;filter:drop-shadow(3px 7px 3px #1a382466);line-height:1.2;margin:8px}.wood{background:linear-gradient(175deg,#a76532,#6e391e 48%,#9c5729);border:5px ridge #c58a4c;border-radius:17px;color:#fff5ce;text-shadow:1px 2px #44200e;box-shadow:0 8px 0 #3f2915,0 12px 20px #1c391c88;padding:13px}.panel{background:linear-gradient(135deg,#fff1ca,#f3d39b);border:5px solid #a36a35;border-radius:22px;padding:20px 16px;margin:20px 0;box-shadow:0 9px 0 #6c4426,0 15px 24px #173d2790}button,input{font:inherit;border-radius:14px;padding:14px;margin:6px 0;width:100%;box-sizing:border-box}button{background:linear-gradient(#b6ee56,#4eae20 55%,#2b7a19);border:3px solid #326a1a;color:#fffbe3;text-shadow:1px 2px #205b19;font-weight:700;box-shadow:0 4px 0 #22581b;min-height:54px;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 1px 0 #22581b}input{background:#fff9e9;border:2px solid #b48245;text-align:center;color:#382416}.muted{color:#fff4d2;text-shadow:1px 2px #34552c}.choice{background:linear-gradient(#e8b979,#bf793a);border:3px solid #925221;color:#472409;text-shadow:none;box-shadow:0 4px 0 #79451f}.choice:active{background:#a5d970}table{width:100%;border-collapse:collapse;text-align:left}td{padding:11px 7px;border-bottom:1px solid #c9995b}td:last-child{text-align:right;font-weight:bold}#game,#finish{display:none}#timer{font-weight:bold;color:#78501f}.acorn{font-size:25px}footer{color:#f9f0c9;text-shadow:1px 2px #2d4d27;font-size:14px;margin-top:30px}@media(prefers-reduced-motion:no-preference){.mascot{animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}}
</style><main><div class="forest">🌲 🍄 🌳</div><div class="wood"><h1>Irregular Verbs Championship</h1></div><div class="dedication">For Yasya, Kate, Ivan and his friends</div><div class="mascot" role="img" aria-label="Белочка-проводник">🐿️</div><p class="muted">Learn · Play · Improve Together!</p><p class="muted">20 questions · 100 points · 60 seconds</p><section id="start" class="panel"><label>Your name<input id="name" maxlength="24" placeholder="Champion’s name"></label><button onclick="startGame()">🌰 Start Game</button></section><section id="game" class="panel"><p id="progress"></p><h2 id="question"></h2><div id="answers"></div><p id="timer"></p></section><section id="finish" class="panel"><h2 id="result"></h2><p id="detail"></p><button onclick="location.reload()">🌿 Play Again</button></section><section class="panel"><h2>🏆 Forest Hall of Fame</h2><p class="muted">Scores on this device. Shared leaderboard coming later.</p><table id="board"></table></section><footer>🍄 A woodland adventure in English · 🐿️</footer></main><script>const verbs=[['go','went','gone'],['see','saw','seen'],['write','wrote','written'],['eat','ate','eaten'],['take','took','taken'],['give','gave','given'],['speak','spoke','spoken'],['break','broke','broken'],['choose','chose','chosen'],['drive','drove','driven'],['begin','began','begun'],['drink','drank','drunk'],['sing','sang','sung'],['swim','swam','swum'],['fly','flew','flown'],['know','knew','known'],['grow','grew','grown'],['throw','threw','thrown'],['forget','forgot','forgotten'],['steal','stole','stolen'],['fall','fell','fallen'],['draw','drew','drawn'],['wear','wore','worn'],['ride','rode','ridden'],['hide','hid','hidden'],['do','did','done'],['make','made','made'],['buy','bought','bought'],['think','thought','thought'],['teach','taught','taught']];let qs=[],i=0,correct=0,deadline=0,tick;const $=id=>document.getElementById(id);function shuffle(a){return a.sort(()=>Math.random()-.5)}function board(){let a=JSON.parse(localStorage.getItem('verbsScores')||'[]');$('board').innerHTML=a.length?a.sort((x,y)=>y.score-x.score||x.time-y.time).slice(0,10).map((x,j)=>'<tr><td>'+(j+1)+'. '+escapeHtml(x.name)+'</td><td>'+x.score+'/100</td></tr>').join(''):'<tr><td>Пока нет результатов</td></tr>'}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function startGame(){if(!$('name').value.trim())return alert('Введите имя');qs=shuffle(verbs.map(v=>({v,form:Math.random()<.5?1:2}))).slice(0,20);$('start').style.display='none';$('game').style.display='block';deadline=Date.now()+60000;tick=setInterval(()=>{let t=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('timer').textContent='Осталось: '+t+' с';if(!t)finish()},200);show()}const tricky={write:['writed','wrotten','writen'],go:['goed','gonee','went'],see:['seed','sawn','seen'],eat:['eated','aten','ate'],take:['taked','tooken','taken'],give:['gived','giveden','gave'],speak:['speaked','spoken','spoked'],break:['breaked','broken','broked'],choose:['choosed','choosen','chosed'],drive:['drived','driven','drove'],begin:['begined','beginned','began'],drink:['drinked','dranken','drank'],sing:['singed','sanged','sang'],swim:['swimmed','swammed','swam'],fly:['flyed','flied','flew'],know:['knowed','knewn','knew'],grow:['growed','grewn','grew'],throw:['throwed','threwen','threw'],forget:['forgetted','forgoten','forgot'],steal:['stealed','stolen','stole'],fall:['falled','fallen','fell'],draw:['drawed','drawn','drew'],wear:['weared','worn','wore'],ride:['rided','ridden','rode'],hide:['hided','hidden','hid'],do:['doed','done','did'],make:['maked','maken','made'],buy:['buyed','boughten','bought'],think:['thinked','thoughten','thought'],teach:['teached','taughten','taught']};function distractors(v,form){let correct=v[form],other=v[form===1?2:1],candidates=[other,...(tricky[v[0]]||[]),v[0]+'ed',v[0]+'en'];let seen=new Set([correct]);return candidates.filter(x=>{if(seen.has(x))return false;seen.add(x);return true}).slice(0,3)};function show(){if(i>=qs.length)return finish();let q=qs[i],target=q.v[q.form],pool=distractors(q.v,q.form);$('progress').textContent='Вопрос '+(i+1)+'/20 · '+correct*5+' очков';$('question').textContent=q.v[0]+' → '+(q.form===1?'Past Simple':'Past Participle');$('answers').replaceChildren();shuffle([target,...pool]).forEach(a=>{let b=document.createElement('button');b.className='choice';b.textContent=a;b.onclick=()=>{if(a===target)correct++;i++;show()};$('answers').append(b)})}function finish(){if($('finish').style.display==='block')return;clearInterval(tick);$('game').style.display='none';$('finish').style.display='block';let time=Math.min(60,Math.round((Date.now()-(deadline-60000))/1000)),score=correct*5;$('result').textContent=score+'/100 очков';$('detail').textContent='Правильно: '+correct+' из '+i+' · Время: '+time+' с';let a=JSON.parse(localStorage.getItem('verbsScores')||'[]');a.push({name:$('name').value.trim(),score,time});localStorage.setItem('verbsScores',JSON.stringify(a));board()}board()</script></html>
