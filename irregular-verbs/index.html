<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Irregular Verbs Championship</title><style>body{font:18px system-ui;background:#101827;color:#f4f6fc;margin:0;padding:20px}main{max-width:520px;margin:auto}.panel{background:#202d42;padding:22px;border-radius:22px;margin:16px 0}button,input{font:inherit;border-radius:12px;padding:13px;margin:5px 0;width:100%;box-sizing:border-box}button{background:#8bd7c5;color:#10212a;border:0;font-weight:700}button:disabled{opacity:.5}input{background:#fff;border:0}h1{font-size:27px}.muted{color:#b6c4d7}.choice{background:#e5eefa}table{width:100%;border-collapse:collapse}td{padding:9px;border-bottom:1px solid #40506a}#game,#finish{display:none}</style><main><h1>Irregular Verbs Championship</h1><p class="muted">20 вопросов · 100 очков · 60 секунд</p><section id="start" class="panel"><label>Ваше имя<input id="name" maxlength="24" placeholder="Имя чемпиона"></label><button onclick="startGame()">Начать игру</button></section><section id="game" class="panel"><p id="progress"></p><h2 id="question"></h2><div id="answers"></div><p id="timer"></p></section><section id="finish" class="panel"><h2 id="result"></h2><p id="detail"></p><button onclick="location.reload()">Играть снова</button></section><section class="panel"><h2>Hall of Fame</h2><p class="muted">Результаты на этом устройстве. Общий рейтинг появится после подключения базы.</p><table id="board"></table></section></main><script>const verbs=[['go','went','gone'],['see','saw','seen'],['write','wrote','written'],['eat','ate','eaten'],['take','took','taken'],['give','gave','given'],['speak','spoke','spoken'],['break','broke','broken'],['choose','chose','chosen'],['drive','drove','driven'],['begin','began','begun'],['drink','drank','drunk'],['sing','sang','sung'],['swim','swam','swum'],['fly','flew','flown'],['know','knew','known'],['grow','grew','grown'],['throw','threw','thrown'],['forget','forgot','forgotten'],['steal','stole','stolen'],['fall','fell','fallen'],['draw','drew','drawn'],['wear','wore','worn'],['ride','rode','ridden'],['hide','hid','hidden'],['do','did','done'],['make','made','made'],['buy','bought','bought'],['think','thought','thought'],['teach','taught','taught']];let qs=[],i=0,correct=0,deadline=0,tick;const $=id=>document.getElementById(id);function shuffle(a){return a.sort(()=>Math.random()-.5)}function board(){let a=JSON.parse(localStorage.getItem('verbsScores')||'[]');$('board').innerHTML=a.length?a.sort((x,y)=>y.score-x.score||x.time-y.time).slice(0,10).map((x,j)=>'<tr><td>'+(j+1)+'. '+escapeHtml(x.name)+'</td><td>'+x.score+'/100</td></tr>').join(''):'<tr><td>Пока нет результатов</td></tr>'}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function startGame(){if(!$('name').value.trim())return alert('Введите имя');qs=shuffle(verbs.map(v=>({v,form:Math.random()<.5?1:2}))).slice(0,20);$('start').style.display='none';$('game').style.display='block';deadline=Date.now()+60000;tick=setInterval(()=>{let t=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('timer').textContent='Осталось: '+t+' с';if(!t)finish()},200);show()}function show(){if(i>=qs.length)return finish();let q=qs[i],target=q.v[q.form],pool=shuffle([...new Set(verbs.map(v=>v[q.form]).filter(x=>x!==target))]).slice(0,3);$('progress').textContent='Вопрос '+(i+1)+'/20 · '+correct*5+' очков';$('question').textContent=q.v[0]+' → '+(q.form===1?'Past Simple':'Past Participle');$('answers').replaceChildren();shuffle([target,...pool]).forEach(a=>{let b=document.createElement('button');b.className='choice';b.textContent=a;b.onclick=()=>{if(a===target)correct++;i++;show()};$('answers').append(b)})}function finish(){if($('finish').style.display==='block')return;clearInterval(tick);$('game').style.display='none';$('finish').style.display='block';let time=Math.min(60,Math.round((Date.now()-(deadline-60000))/1000)),score=correct*5;$('result').textContent=score+'/100 очков';$('detail').textContent='Правильно: '+correct+' из '+i+' · Время: '+time+' с';let a=JSON.parse(localStorage.getItem('verbsScores')||'[]');a.push({name:$('name').value.trim(),score,time});localStorage.setItem('verbsScores',JSON.stringify(a));board()}board()</script></html>
